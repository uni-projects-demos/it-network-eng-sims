name: deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install wasm-pack
        uses: taiki-e/install-action@wasm-pack

      - name: Install npm
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Config
        id: pages
        uses: actions/configure-pages@v6

      - name: Build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build:all

      - name: Upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
