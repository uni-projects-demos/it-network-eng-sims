[package]
name = "it-network-eng-sim"
description = "IT network engineering simulations ported to Rust/WebAssembly for interactive web demos with SvelteKit UI."
repository = "https://github.com/r055a/it-network-eng-sims"
license = "GPL-3.0"
version = "1.0.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"

[dev-dependencies]
serde_json = "1"
