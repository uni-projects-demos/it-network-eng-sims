[package]
name = "it-network-eng-sim"
rust-version = "1.100"
description = "Rust/WASM engine for an interactive IT network engineering simulations, including TCP, UDP, RIP, OSPF, WSN, & Network Flow Optimisation."
repository = "https://github.com/uni-projects-demos/it-network-eng-sims"
license = "GPL-3.0"
version = "1.0.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
quick-xml = "0.38"
