<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1218" data-light="#f5f7fa" data-dark="#0b1218" />
    <script>
      (() => {
        try {
          const root = document.documentElement;
          const saved = localStorage.getItem('network-sim-theme');
          const isDark = saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          root.classList.toggle('dark', isDark);
          root.dataset.theme = isDark ? 'dark' : 'light';
          root.style.colorScheme = isDark ? 'dark' : 'light';
          const locale = localStorage.getItem('network-sim-locale');
          if (locale) { root.lang = locale; root.dataset.locale = locale; }
        } catch {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
